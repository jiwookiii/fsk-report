<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>보안 문서 · 로그인</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1f2329}
.box{width:min(400px,92vw);background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:30px 28px;box-shadow:0 8px 30px rgba(14,48,109,.08)}
.brand{font-size:12px;font-weight:700;color:#0E306D;letter-spacing:.5px;border-left:3px solid #F47725;padding-left:8px}h1{font-size:18px;margin:12px 0 4px;line-height:1.4}.sub{color:#5c646e;font-size:12.5px;margin:0 0 18px}
label{display:block;font-size:12px;color:#5c646e;margin-bottom:12px}input{display:block;width:100%;margin-top:4px;font:inherit;padding:10px 12px;border:1px solid #cfd4db;border-radius:7px}input:focus{outline:2px solid #0072C6;border-color:transparent}
button{width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:7px;background:#0E306D;color:#fff;cursor:pointer;margin-top:4px}button:disabled{opacity:.6;cursor:wait}
.err{color:#EA002C;font-size:12.5px;min-height:18px;margin:10px 0 0}.foot{font-size:11px;color:#8a919b;margin:16px 0 0;text-align:center}
</style>
</head>
<body>
<div class="box">
 <div class="brand">암호화 문서</div>
 <h1 id="tt">보안 문서</h1>
 <p class="sub" id="sub">문서를 불러오는 중…</p>
 <form id="lf" autocomplete="on" hidden>
  <label>아이디<input id="lu" autocomplete="username" required></label>
  <label>비밀번호<input id="lp" type="password" autocomplete="current-password" required></label>
  <p id="lc" class="err" style="min-height:0;margin:-6px 0 8px"></p>
  <button id="lb" type="submit">로그인</button>
  <p id="lm" class="err"></p>
 </form>
 <p class="foot">암호화된 문서 · 무단 배포 금지</p>
</div>
<script>
// 암호화 데이터 위치. 계정 발급 도구(admin.html)가 만든 파일을 이 경로에 올리면 됨
const DATA='data/report.enc.json';
let P=null;
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),en=new TextEncoder(),g=i=>document.getElementById(i);
const hb=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
(async()=>{const sub=g('sub');
 try{if(location.protocol==='file:')throw new Error('file');
  const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error(r.status===404?'nf':'http');
  P=await r.json();if(!P||!P.ct||!P.iv||!Array.isArray(P.acc))throw new Error('fmt');
  if(P.title){g('tt').textContent=P.title;document.title=P.title+' · 로그인'}
  sub.textContent='권한이 있는 계정으로 로그인';g('lf').hidden=false;g('lu').focus();
 }catch(e){const m=e&&e.message;sub.style.color='#EA002C';
  sub.textContent=m==='file'?'이 페이지는 게시된 주소(https)에서만 열림. 내려받은 파일로는 열 수 없음':m==='nf'?'게시된 문서가 없음. 관리자에게 문의':m==='fmt'?'문서 데이터 형식 오류. 관리자에게 문의':'문서를 불러오지 못함. 잠시 후 새로고침';}
})();
g('lp').addEventListener('keyup',e=>{const c=e.getModifierState&&e.getModifierState('CapsLock');g('lc').textContent=c?'Caps Lock 켜짐':''});
async function idHash(id){const s=en.encode(id.trim().toLowerCase());let u;
 if(P.v>=3){const salt=d(P.ids);u=new Uint8Array(salt.length+s.length);u.set(salt);u.set(s,salt.length)}else u=en.encode('fsk-login:'+id.trim().toLowerCase());
 return hb(new Uint8Array(await crypto.subtle.digest('SHA-256',u)))}
g('lf').onsubmit=async e=>{e.preventDefault();const b=g('lb'),m=g('lm');m.textContent='';b.disabled=true;b.textContent='확인 중…';
 try{if(!window.crypto||!crypto.subtle)throw new Error('ns');
  const h=await idHash(g('lu').value),a=P.acc.find(x=>x.h===h);
  const pv=g('lp').value;if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(pv))throw new Error('ko');
  if(!a)throw new Error('auth');
  const tryPw=async pw=>{const base=await crypto.subtle.importKey('raw',en.encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
   const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(a.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   return await crypto.subtle.decrypt({name:'AES-GCM',iv:d(a.i)},k,d(a.k))};
  let raw;try{raw=await tryPw(pv)}catch(_){if(pv.trim()!==pv){try{raw=await tryPw(pv.trim())}catch(__){}}}
  if(!raw)throw new Error('auth');let kr=raw,wm='';
  if(P.v>=2){const o=JSON.parse(new TextDecoder().decode(raw));kr=d(o.k);wm=o.w||''}
  const ck=await crypto.subtle.importKey('raw',kr,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},ck,d(P.ct)));
  try{document.open();document.write(html);document.close()}catch(_){const f=document.createElement('iframe');f.setAttribute('style','position:fixed;inset:0;width:100%;height:100%;border:0');f.srcdoc=html;document.body.innerHTML='';document.body.appendChild(f)}
  if(wm){const ex=function(t){return t.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
   const svg="<svg xmlns='http://www.w3.org/2000/svg' width='506' height='345'><text x='253' y='172.5' fill='rgba(60,66,78,0.08625)' font-size='19.55' font-weight='500' font-family='Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif' text-anchor='middle' dominant-baseline='middle' transform='rotate(-45 253 172.5)'>"+ex(wm)+"</text></svg>";
   const url='url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")';
   const css='position:fixed!important;inset:0!important;pointer-events:none!important;z-index:2147483647!important;background-image:'+url+'!important;background-repeat:repeat!important;display:block!important;opacity:1!important;visibility:visible!important;mix-blend-mode:multiply!important';
   const add=function(){let el=document.getElementById('__wm');if(!el){el=document.createElement('div');el.id='__wm';el.setAttribute('aria-hidden','true');document.documentElement.appendChild(el)}if(el.getAttribute('style')!==css)el.setAttribute('style',css);
    if(!document.getElementById('__wms')){const st=document.createElement('style');st.id='__wms';st.textContent='dialog{background-image:'+url+'!important;background-repeat:repeat!important}@media print{#__wm{position:fixed!important;display:block!important}}';(document.head||document.documentElement).appendChild(st)}};
   add();new MutationObserver(add).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class','hidden']});}
 }catch(err){await new Promise(r=>setTimeout(r,900));const em=err&&err.message;
  m.textContent=em==='ns'?'이 브라우저에서는 열 수 없음. Chrome 또는 Edge 최신 버전으로 열 것':em==='ko'?'비밀번호에 한글이 입력됨. 한/영 키 확인':em==='auth'?'아이디 또는 비밀번호가 맞지 않음. Caps Lock·한/영 확인':'열기 실패: '+(em||err);
  b.disabled=false;b.textContent='로그인';g('lp').value='';g('lp').focus()}};
</script>
</body>
</html>
